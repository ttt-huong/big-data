version: "3.8"

services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: lakehouse-minio
    ports:
      - "9000:9000"   # API endpoint
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: lakehouse-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing myminio/lakehouse-metadata;
      /usr/bin/mc mb --ignore-existing myminio/lakehouse-images;
      exit 0;
      "

  pipeline:
    build: .
    container_name: lakehouse-pipeline
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      - MINIO_ENDPOINT=http://minio:9000
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./logs:/app/logs

volumes:
  minio-data:
